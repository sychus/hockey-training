[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

# API routes (most specific first)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback (catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "og-meta"
  path = "/s/*"
